{% extends "base.html" %}
{% load static %}
{% block title %}تماس با ما{% endblock title %}
{% block content %}
  <!-- ***** Page Heading Start ***** -->
  <div class="page-heading header-text">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h3>تماس با ما</h3>

          <span class="breadcrumb">
            <a href="index.html">خانه</a>
            &gt;
            تماس با ما
          </span>
        </div>
      </div>
    </div>
  </div>
  <!-- ***** Page Heading End ***** -->

  <!-- ***** Contact Page Start ***** -->
  <div class="contact-page section">
    <div class="container">
      <div class="row">

        <div class="col-lg-6 align-self-center">
          <div class="left-text">
            <div class="section">
          <div class="left-text">
            <div class="section              <h2>بگو سلام!</h2>
            </div>

            <p>
              قالب بازی LUGX بر اساس آخرین چارچوب Bootstrap 5 CSS است.
              این قالب توسط پرشین تم ارائه شده است و برای وب‌سایت‌های
              تجارت الکترونیک فروشگاه بازی شما مناسب است.
              با خیال راحت از این برای هر هدفی استفاده کنید. متشکرم.
            </p>

            <ul>
              <li>
                <span>آدرس</span>
                ایران، تهران
              </li>

              <li>
                <span>تلفن</span>
                021 23 456 7890
              </li>

              <li>
                <span>ایمیل</span>
                lugx@contact.com
              </li>
            </ul>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="right-content">
            <div class="row">

              <div class="col-lg-12">
                <div id="map">
                  <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12469.776493332698!2d-80.14036379941481!3d25.907788681148624!2m3!1f357.26927939317244!2f20.870722720054623!3f0!3m2!1i1024!2i768!4f35!3m3!1m2!1s0x88d9add4b4ac788f%3A0xe77469d09480fcdb!2sSunny%20Isles%20Beach!5e1!3m2!1sen!2sth!4v1642869952544!5m2!1sen!2sth"
                    width="100%"
                    height="325"
                    frameborder="0"
                    style="border: 0; border-radius: 23px;"
                    allowfullscreen
                  ></iframe>
                </div>
              </div>

              <divdiv>
              </div>

              <divform
                  id="contact-form"
                  action=""
                  method="post"
                >
                  {% csrf_token %}

                  <div class="row">

                    <div class="col-lg-6">
                      <fieldset>
                        <input
                          type="text"
                          name="name"
                          id="name"
                          placeholder="نام..."
                          autocomplete="on"
                          required
                        >
                      </fieldset>
                    </div>

                    <div class="col-lg-6">
                      <fieldset>
                        <input
                          type="text"
                          name="surname"
                          id="surname"
                          placeholder="نام خانوادگی..."
                          autocomplete="on"
                          required
                        >
                      </fieldset>
                    </div>

                    <div class="col-lg-6">
                      <fieldset>
                        <input
                          type="email"
                          name="email"
                          id="email"
                          placeholder="ایمیل..."
                          autocomplete="on"
                          required
                        >
                      </fieldset>
                    </div>

                    <div class="col-lg-6">
                      <fieldset>
                        <input
                          type="text"
                          name="subject"
                          id="subject"
                          placeholder="موضوع..."
                          autocomplete="on"
                        >
                      </fieldset>
                    </div>

                    <div class="col-lg-12">
                      <fieldset>
                        <textarea
                          name="message"
                          id="message"
                          placeholder="پیام..."
                          required
                        ></textarea>
                      </fieldset>
                    </div>

                    <div class="col-lg-12">
                      <fieldset>
                        <button
                          type="submit"
                          id="form-submit"
                          class="orange-button"
                        >
                          ارسال پیام
                        </button>
                      </fieldset>
                    </div>

                  </div>
                </form>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <!-- ***** Contact Page End ***** -->
{% endblock content %}
